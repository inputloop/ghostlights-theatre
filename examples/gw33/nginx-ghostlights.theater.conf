# ghostlights.theater on gw33: plain files from /var/www/ghostlights.theater/public, over TLS.
# Installed by install.sh once certbot holds the certificate (webroot, so nginx never stops).
# Copyright 2026 INPUTLOOP; GPL-3.0-or-later OR LGPL-3.0-or-later.

log_format logreq_ghostlights_theater '$remote_addr $time_iso8601 "$uri" $status "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name ghostlights.theater www.ghostlights.theater;
    access_log /var/log/nginx/ghostlights.theater/access.log logreq_ghostlights_theater;
    error_log /var/log/nginx/ghostlights.theater/error.log;
    log_not_found off;
    location /.well-known/acme-challenge/ { root /var/www/ghostlights.theater/public; }
    location / { return 301 https://ghostlights.theater$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ghostlights.theater www.ghostlights.theater;
    access_log /var/log/nginx/ghostlights.theater/access.log logreq_ghostlights_theater;
    error_log /var/log/nginx/ghostlights.theater/error.log;
    log_not_found off;
    ssl_certificate     /etc/letsencrypt/live/ghostlights.theater/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghostlights.theater/privkey.pem;
    root /var/www/ghostlights.theater/public;
    index index.html;
    error_page 404 /404.html;
    autoindex off;
    etag on;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The house pages: nothing inline, nothing from another host, no scripts at all.
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    location / { try_files $uri $uri/ =404; }
    # A show is one self-contained page whose own <meta> policy lists its inline script and style by
    # hash. This header adds only what a <meta> policy cannot say; add_header does not inherit, so the
    # other headers are repeated.
    location /build-a-ghostwheel/ {
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ =404;
    }
}
